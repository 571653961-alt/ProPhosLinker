# config.yaml
data_processing:
  pro_miss_value_ratio: 0.5
  phos_miss_value_ratio: 0.5
  pro_imputation_method: "knn"
  phos_imputation_method: "knn"
  pro_normalization_method: "median"
  phos_normalization_method: "median"

pa:
  dim_rd_mtd: "PCA"

nmf:
  NMF_pro_filter_num: 3000
  NMF_phos_filter_num: 3000

wgcna:
  WGCNA_pro_filter_num: 10000
  WGCNA_phos_filter_num: 10000
  protein_cor_method: "spearman"
  protein_corFun_tmp: "bicor"
  protein_cluster_method: "average"
  protein_networkType: "unsigned"
  protein_RsquareCut_val: 0.89
  protein_mergingThresh: 0.2
  protein_minModuleSize: 10
  protein_SoftPower: 6
  phosphoprotein_cor_method: "spearman"
  phosphoprotein_corFun_tmp: "bicor"
  phosphoprotein_cluster_method: "average"
  phosphoprotein_networkType: "unsigned"
  phosphoprotein_RsquareCut_val: 0.89
  phosphoprotein_mergingThresh: 0.2
  phosphoprotein_minModuleSize: 10
  phosphoprotein_SoftPower: 6
module_cor_threshhold: 0.5
module_cor_p_adj: 0.05
  module_cor_method: "spearman"

phosrate_subtyping:
  robust_quantiles: "5%,95%"
  high_overlap_coefficient: 0.50
  high_overlap_iqr_ratio: 0.50
  partial_overlap_coefficient: 0.20
  fdr_threshold: 0.05
  effect_threshold_log2: 1.0
  conditional_spline_df: 3
  prediction_grid_points: 180
  support_tolerance: 0
  # Conditional-response curve figures (2.2phosRate_subtyping.R: make_conditional_plot).
  # Every value maps 1:1 to the R script's --plot-* options; see README for details.
  plot:
    width: 8.0             # inches
    height: 6.0            # inches
    dpi: 300
    base_size: 13.0        # theme_classic base size
    title_size: 22.0       # title: bold, left aligned to the panel
    axis_title_size: 15.0  # axis titles: bold
    axis_text_size: 13.0   # tick labels: bold
    legend_size: 14.0      # legend on top, left aligned
    caption_size: 11.0     # Low/Middle/High statistics, bottom left (plain, not bold)
    line_width: 2.0        # fitted curves
    point_size: 1.8
    point_alpha: 0.55
    ribbon_alpha: 0.15     # joint-model confidence band
    spine_width: 1.2       # axis lines (left and bottom only)
    tick_width: 1.2
    tick_length: 4.0       # points
    dash_color: "grey45"   # interval boundary lines
    dash_width: 1.1
    panel_low: "#F7F9FC"   # low-interval background panel
    panel_mid: "#FFF9EF"   # middle-interval background panel
    panel_high: "#F9F5FA"  # high-interval background panel
    caption_color: "grey30"
    group_labels: "N,T"    # legend labels for Control, Case
    n_representative: 5    # sites per global class (UP/DOWN/Non-significant) for representative plots; auto-wired from 2.1 PhosProtein diff

differential_network:
  differential_network_filter_num: 2000
  differential_network_FC_threshold: 2
  differential_network_p_threshold: 0.05
  differential_network_p_value_type: "q_value"
  differential_network_nBoots: 20
  differential_network_bootnet_R_threshold: 0.3
  differential_network_nCores: 6
  differential_network_stability_threshold: 0.4
  differential_network_cor_method: "spearman"
  differential_network_edge_FC_threshold: 2
  differential_network_edge_p_threshold: 0.05
  differential_network_max_subnet_num: 6
  differential_network_R_threshold: 0.5

functional_enrichment:
  GO_showCategory: 6
  KEGG_showCategory: 18

kgbased_network:
  kgbased_network_top_n: 6
  kgbased_network_top_nodes_visualization_num: 70
  kgbased_network_max_phosphoSite_displayed: 5
  kgbased_network_node_filtering: "betweenness"
  kgbased_network_layout: "kk"
  kgbased_network_comm_detection: "infomap"
  
hub_protein_network:
  hub_protein_top_n: 6
  hub_protein_d_num: 5
  hub_protein_network_layout: "kk"